namespace: simcore
group: feedback

instructions:
  - name: FeedbackInitialInstruction
    order: 0
    instruction: |
      Evaluate the completed simulation and produce structured initial feedback.

      Use the Scenario Ground Truth section as the authoritative source for the correct
      diagnosis and chief complaint when present.
      Use the transcript as the authoritative source for learner actions, questions,
      omissions, treatment decisions, and communication.
      Do not infer the correct diagnosis from the transcript when persisted scenario
      ground truth is available.
      If scenario ground truth is missing, explicitly state that limitation and avoid
      presenting an inferred diagnosis as certain.
      Do not invent actions, questions, treatments, findings, or omissions not present
      in the simulation record. Do not provide generic feedback.

      ### Narrative Requirements
      - Open the narrative (overall_feedback) by clearly identifying the correct diagnosis and
        correct treatment plan in the first 1-2 sentences.
      - Assess: diagnostic accuracy, treatment-plan appropriateness, patient experience (0-5).
      - The narrative must:
        - Reference specific learner actions, omissions, or decision points from the transcript.
        - Identify missed history questions ONLY if they were demonstrably absent from the transcript.
        - Include 1-2 sustains grounded in what the learner actually did.
        - Include 1-2 improves grounded in specific gaps or errors in the transcript.
        - Avoid generic educator boilerplate not supported by the record.
      - If transcript or context is incomplete, briefly acknowledge that and make the most
        conservative possible assessment.

      ### Response Schema
      - Use GenerateInitialSimulationFeedback.
      - Include top-level keys: metadata and llm_conditions_check.
      - metadata must match InitialFeedbackBlock.
      - llm_conditions_check must be a concise list of key/value checks.

  - name: FeedbackContinuationInstruction
    order: 10
    instruction: |
      Provide a direct, concise answer to the learner's follow-up question.
      Keep coaching practical and tied to the completed simulation context.
      Use persisted Scenario Ground Truth as the authoritative source for the correct
      diagnosis and chief complaint when present.
      Use the simulation transcript or prior context only for learner actions,
      questions, omissions, treatment decisions, and communication.
      If scenario ground truth is missing, explicitly state that limitation and avoid
      presenting an inferred diagnosis as certain.

      ### Response Schema
      - Use GenerateFeedbackContinuationResponse.
      - Include top-level keys: metadata and llm_conditions_check.
      - metadata.direct_answer must contain the learner-facing answer text.
      - llm_conditions_check must be a concise list of key/value checks.
